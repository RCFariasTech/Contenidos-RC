<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtro Refracción Líquida</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #dcdcd6; --accent: #1d1d1b; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --panel: #1b1b1a; --text: #ecece8; --muted: #9a9a94;
      --line: #333330; --accent: #ecece8; --accent-text: #121212;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; min-height: 100vh; }
  .stage { display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; }
  .canvas-wrap { position: relative; max-width: 100%; max-height: calc(100vh - 32px); display: none; }
  .canvas-wrap.on { display: block; }
  canvas { display: block; max-width: 100%; max-height: calc(100vh - 32px); width: auto; height: auto;
    border-radius: 6px; background: #000; touch-action: manipulation; }
  .drop { width: min(520px, 100%); border: 2px dashed var(--line); border-radius: 12px; padding: 48px 24px;
    text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--text); color: var(--text); }
  .drop strong { display: block; font-size: 18px; color: var(--text); margin-bottom: 6px; }
  #mk { display: none; position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; pointer-events: none;
    background: transparent; border-radius: 6px; opacity: 0; }
  #ring { position: absolute; left: 0; top: 0; border: 1.5px solid rgba(255,255,255,.85); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); pointer-events: none; display: none; }
  canvas#cv.brush { cursor: none; touch-action: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; max-height: 100vh; }
  h1 { font-size: 17px; margin: 0 0 14px; }
  .ctl { margin-bottom: 14px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 7px 4px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .btn { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 10px; border-radius: 8px; font: inherit; cursor: pointer; margin-bottom: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row .btn { margin-bottom: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .err { color: #b3261e; font-size: 13px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .grid3 .ctl { margin: 0; min-width: 0; }
  .grid3 label { font-size: 12px; }
  select { width: 100%; padding: 6px 4px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
    color: var(--text); font: inherit; font-size: 13px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: none; }
    .canvas-wrap, canvas { max-height: 60vh; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong>Elige o arrastra una imagen</strong>
      JPG, PNG o WebP. Se procesa en tu navegador; la imagen no se sube a ningún servidor.
    </div>
    <div class="canvas-wrap" id="wrap"><canvas id="cv"></canvas><canvas id="mk"></canvas><div id="ring"></div></div>
    <input type="file" id="file" accept="image/*,.heic,.heif" hidden>
  </main>

  <aside>
    <h1>Refracción líquida</h1>
    <button class="btn" id="seed">Nuevo patrón (semilla)</button>
    <button class="btn" id="open">Cambiar imagen</button>

    <div class="ctl"><label>Intensidad <span id="vInt"></span></label>
      <input type="range" id="int" min="0" max="1" step="0.01" value="0.65"></div>
    <div class="ctl"><label>Cobertura <span id="vCov"></span></label>
      <input type="range" id="cov" min="0" max="1" step="0.01" value="0.7"></div>

    <div class="grid3">
      <div class="ctl"><label for="selSize">Pliegue</label>
        <select id="selSize" data-key="size"><option value="0">Amplio</option><option value="1">Fino</option><option value="2" selected>Mixto</option></select></div>
      <div class="ctl"><label for="selDir">Dirección</label>
        <select id="selDir" data-key="dir"><option value="0">Horizontal</option><option value="1" selected>Diagonal</option><option value="2">Libre</option></select></div>
      <div class="ctl"><label for="selDup">Duplicación</label>
        <select id="selDup" data-key="dup"><option value="0">Ninguna</option><option value="1" selected>Sutil</option><option value="2">Marcada</option></select></div>
    </div>

    <hr class="sep">
    <div class="ctl"><label>Herramienta de pincel</label>
      <div class="seg" data-key="tool"><button data-v="0" class="on">Ninguna</button><button data-v="1">Proteger</button><button data-v="2">Mover gel</button></div></div>

    <div class="grid3">
      <div class="ctl" title="Diámetro del dedo al mover el gel (arrastra sobre la imagen)"><label>Dedo <span id="vGrad"></span></label>
        <input type="range" id="grad" min="0.04" max="0.8" step="0.005" value="0.25"></div>
      <div class="ctl" title="Diámetro del pincel de zona protegida (pinta sobre ojos, texto o producto)"><label>Zona <span id="vRad"></span></label>
        <input type="range" id="rad" min="0.02" max="0.6" step="0.005" value="0.12"></div>
      <div class="ctl" title="Menos de 1: el gel sigue al dedo solo en parte. Más de 1: lo arrastra más lejos"><label>Fuerza <span id="vStr"></span></label>
        <input type="range" id="gstr" min="0.2" max="2" step="0.05" value="1"></div>
    </div>

    <div class="row"><button class="btn" id="undo" disabled>Deshacer (Ctrl/Cmd+Z)</button></div>
    <div class="row">
      <button class="btn" id="clearP" disabled>Borrar zona protegida</button>
      <button class="btn" id="clearG" disabled>Restablecer gel</button>
    </div>

    <hr class="sep">
    <button class="btn" id="cmp">Mantén pulsado: ver original</button>
    <button class="btn primary" id="dl" disabled>Descargar PNG</button>
    <p class="hint" id="info"></p>
    <p class="err" id="err"></p>
  </aside>
</div>

<script>
"use strict";
const MASK_SIDE = 768;   // resolución de la máscara del pincel
const MAX_UNDO = 40;
const MAX_SIDE = 4096;
const GEL_SIDE = 512;    // resolución del campo del gel

const VERT = `
attribute vec2 a;
varying vec2 vUv;
void main(){ vUv = vec2(a.x*0.5+0.5, 0.5-a.y*0.5); gl_Position = vec4(a,0.,1.); }`;

const COMMON = `
precision highp float;
varying vec2 vUv;
uniform float aspect, intensity, coverage, seed, sizeMix, dirMode, dupAmt;
uniform sampler2D mask;            // alfa = zona protegida (pincel)
uniform sampler2D ufield;          // desplazamiento extra del gel movido con el dedo (16 bits por eje)
uniform vec2 uTexel;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+vec2(17.7,93.1))); }

// ruido de valor suave (C2)
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.-15.)+10.);
  float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float s = 0., a = .5;
  for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 11.7; a *= .5; }
  return s;
}

vec2 mirror(vec2 uv){ return 1. - abs(1. - mod(uv, 2.)); }

// "grosor" de la lámina transparente en el punto p (espacio con alto = 1)
float height(vec2 p){
  // orientación de los pliegues
  float ang = dirMode < .5 ? 0.0 : (dirMode < 1.5 ? -0.62 + 0.25*(vnoise(vec2(seed*.37,1.))-.5) : (fbm(p*.7+seed)-.5)*4.2);
  float c = cos(ang), s = sin(ang);
  vec2 q = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
  q.x *= .42;                       // alarga los pliegues a lo largo de la dirección
  q += seed*3.1;
  // domain warp: rompe cualquier regularidad (ni senoidal ni concéntrico)
  vec2 w = vec2(fbm(q*1.1), fbm(q*1.1+7.3)) - .5;
  q += w*2.2;
  float coarse = fbm(q*1.5);
  float fine   = fbm(q*4.6 + 3.0);
  float rid    = 1. - abs(2.*fbm(q*2.7+9.1) - 1.);
  float wc = sizeMix < .5 ? 1. : (sizeMix < 1.5 ? .12 : .55);
  float wf = sizeMix < .5 ? .1 : (sizeMix < 1.5 ? 1. : .55);
  float h = wc*coarse + wf*(.5*fine + .6*rid*rid) ;
  // plegado: invierte localmente el desplazamiento => fragmentos duplicados
  h += dupAmt * .05 * sin(h*38. + 5.*coarse);
  return h;
}

float coverMask(vec2 p){
  float n = fbm(p*1.15 + seed*1.7 + 40.);
  float lo = mix(.6, -.12, coverage);
  return smoothstep(lo, lo+.22, n);
}

float protect(vec2 uv){ return 1. - texture2D(mask, uv).a; }

// campo del gel movido: dos canales de 8 bits por eje (RGBA8 sirve en cualquier GPU)
const float UR = 1.;
vec2 decodeU(vec4 t){ t = floor(t*255. + .5); return ((vec2(t.x,t.z)*256. + vec2(t.y,t.w)) - 32768.)/32768.*UR; }
vec2 fetchU(vec2 tc){ return decodeU(texture2D(ufield, tc)); }
vec2 getU(vec2 uv){                // bilineal manual (la textura es NEAREST)
  vec2 tc = vec2(uv.x, 1.-uv.y);
  vec2 st = tc/uTexel - .5; vec2 i = floor(st), f = fract(st);
  vec2 a = fetchU((i+vec2(.5,.5))*uTexel), b = fetchU((i+vec2(1.5,.5))*uTexel);
  vec2 c = fetchU((i+vec2(.5,1.5))*uTexel), d = fetchU((i+vec2(1.5,1.5))*uTexel);
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}`;

// Empuje del dedo. El campo guarda O(x) = M(x) - x, donde M(x) es el punto del gel ORIGINAL
// que ahora está en x. Empujar es M'(x) = M(x - v·w): se mueve el gel entero (pliegues,
// brillos, gotas y colores) y todo se evalúa luego en M(x).
const PUSH = COMMON + `
uniform vec2 pc, pv;
uniform float pr;
void main(){
  vec2 tc = gl_FragCoord.xy * uTexel;
  vec2 uv = vec2(tc.x, 1.-tc.y);
  float t = length((uv - pc) * vec2(aspect, 1.)) / pr;
  if(t >= 1.){ gl_FragColor = texture2D(ufield, tc); return; }   // copia exacta fuera del pincel
  float w = 1. - t*t; w *= w;
  vec2 q = uv - pv*w;
  vec2 nu = clamp(q + getU(q) - uv, -UR, UR);
  vec2 n = clamp(floor(nu/UR*32768. + 32768. + .5), 0., 65535.);
  vec2 hi = floor(n/256.), lo = n - hi*256.;
  gl_FragColor = vec4(hi.x, lo.x, hi.y, lo.y) / 255.;
}`;

const FRAG = COMMON + `
uniform sampler2D tex;
uniform float showOrig, hasGel;

// campo de desplazamiento (en uv) + diagnóstico para bordes
void field(vec2 p, float prot, out vec2 d, out float edge){
  float e = .0025;
  float h  = height(p);
  float hx = height(p+vec2(e,0.)), hxm = height(p-vec2(e,0.));
  float hy = height(p+vec2(0.,e)), hym = height(p-vec2(0.,e));
  vec2 g = vec2(hx-hxm, hy-hym)/(2.*e);
  float lap = (hx+hxm+hy+hym-4.*h)/(e*e);
  float amp = intensity * coverMask(p) * prot;
  d = -g * (.034*amp);
  d /= 1. + length(d)/.06;          // límite suave: evita zonas ilegibles
  d.x /= aspect;
  edge = clamp(lap*.00055*amp*(.4+intensity), -1., 1.);
}

void main(){
  vec2 uv = vUv;
  if(showOrig > .5){ gl_FragColor = texture2D(tex, uv); return; }
  vec2 M = hasGel > .5 ? uv + getU(uv) : uv;      // posición de este punto en el gel original
  vec2 p = M * vec2(aspect, 1.);
  float pm = protect(uv);

  vec2 d; float edge;
  field(p, pm, d, edge);

  vec3 col = texture2D(tex, mirror(M + d)).rgb;

  // bordes líquidos finos: claro en una cara de la cresta, oscuro en la otra
  float hi = max(edge, 0.), lo = max(-edge, 0.);
  col = mix(col, col + (1.-col)*.55, clamp(hi,0.,1.));
  col *= 1. - .45*clamp(lo,0.,1.);

  gl_FragColor = vec4(clamp(col,0.,1.), 1.);
}`;

const $ = id => document.getElementById(id);
const cv = $("cv"), wrap = $("wrap"), drop = $("drop"), errEl = $("err");
const state = { size: 2, dir: 1, dup: 1, seed: 1.0, tool: 0, hasGel: false, loaded: false, showOrig: 0 };

let gl, prog, pushProg, tex, maskTex, U = {}, PL = {}, gelTex = [null, null], gelFbo = [null, null], gelCur = 0, uw = 1, uh = 1, imgW = 0, imgH = 0, raf = 0;

function makeProgram(fragSrc) {
  const sh = (t, src) => {
    const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x));
    return x;
  };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(p, 0, "a");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const locs = (p, names) => Object.fromEntries(names.map(n => [n, gl.getUniformLocation(p, n)]));
const COMMON_U = ["aspect","intensity","coverage","seed","sizeMix","dirMode","dupAmt","mask","ufield","uTexel"];

function initGL() {
  gl = cv.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
  if (!gl) { errEl.textContent = "Tu navegador no soporta WebGL."; return false; }
  try {
    prog = makeProgram(FRAG);
    pushProg = makeProgram(PUSH);
  } catch (e) { errEl.textContent = "Error de shader: " + e.message; return false; }
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  U = locs(prog, [...COMMON_U, "tex", "showOrig", "hasGel"]);
  PL = locs(pushProg, [...COMMON_U, "pc", "pv", "pr"]);
  tex = gl.createTexture();
  maskTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.activeTexture(gl.TEXTURE0);
  return true;
}

// campo del gel: dos texturas RGBA8 (ping-pong), 0 = sin desplazamiento extra
function zeroGelData() {
  const d = new Uint8Array(uw * uh * 4);
  for (let i = 0; i < uw * uh; i++) { d[i*4] = 128; d[i*4+2] = 128; }
  return d;
}
function initGel(w, h) {
  const k = GEL_SIDE / Math.max(w, h);
  uw = Math.max(1, Math.round(w * k)); uh = Math.max(1, Math.round(h * k));
  const zero = zeroGelData();
  gl.activeTexture(gl.TEXTURE2);
  for (let j = 0; j < 2; j++) {
    if (gelTex[j]) { gl.deleteTexture(gelTex[j]); gl.deleteFramebuffer(gelFbo[j]); }
    gelTex[j] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, gelTex[j]);
    for (const [kk, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                           [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
      gl.texParameteri(gl.TEXTURE_2D, kk, v);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, uw, uh, 0, gl.RGBA, gl.UNSIGNED_BYTE, zero);
    gelFbo[j] = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, gelFbo[j]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gelTex[j], 0);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0);
  gelCur = 0; state.hasGel = false;
}
function setCommon(L) {
  gl.uniform1f(L.aspect, imgW / imgH);
  gl.uniform1f(L.intensity, +$("int").value);
  gl.uniform1f(L.coverage, +$("cov").value);
  gl.uniform1f(L.seed, state.seed);
  gl.uniform1f(L.sizeMix, state.size);
  gl.uniform1f(L.dirMode, state.dir);
  gl.uniform1f(L.dupAmt, state.dup);
  gl.uniform1i(L.mask, 1);
  gl.uniform1i(L.ufield, 2);
  gl.uniform2f(L.uTexel, 1 / uw, 1 / uh);
}
function pushStep(cx, cy, vx, vy, r) {
  const dst = 1 - gelCur;
  gl.useProgram(pushProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, gelFbo[dst]);
  gl.viewport(0, 0, uw, uh);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, gelTex[gelCur]);
  setCommon(PL);
  gl.uniform2f(PL.pc, cx, cy); gl.uniform2f(PL.pv, vx, vy); gl.uniform1f(PL.pr, r);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gelCur = dst;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, imgW, imgH);
  gl.activeTexture(gl.TEXTURE0);
}
function snapGel() {
  const b = new Uint8Array(uw * uh * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, gelFbo[gelCur]);
  gl.readPixels(0, 0, uw, uh, gl.RGBA, gl.UNSIGNED_BYTE, b);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return b;
}
function restoreGel(b) {
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, gelTex[gelCur]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, uw, uh, gl.RGBA, gl.UNSIGNED_BYTE, b);
  gl.activeTexture(gl.TEXTURE0);
}

async function decode(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
  }
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img); img.onerror = () => rej(new Error("decode"));
      img.src = url;
    });
  } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}

async function loadImage(file) {
  errEl.textContent = "";
  if (!gl) { errEl.textContent = errEl.textContent || "WebGL no está disponible."; return; }
  try {
    let src;
    try { src = await decode(file); }
    catch (e) {
      const heic = /hei[cf]/i.test(file.type + file.name);
      throw new Error(heic
        ? "Este navegador no puede leer HEIC/HEIF. Abre la app en Safari o exporta la foto a JPG/PNG."
        : "No se pudo leer esa imagen (formato no compatible o archivo dañado).");
    }
    let w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    const lim = Math.min(MAX_SIDE, gl.getParameter(gl.MAX_TEXTURE_SIZE));
    const k = Math.min(1, lim / Math.max(w, h));
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    const tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h;
    tmp.getContext("2d").drawImage(src, 0, 0, w, h);
    if (src.close) src.close();
    imgW = w; imgH = h; cv.width = w; cv.height = h;
    gl.viewport(0, 0, w, h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tmp);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    resetMask(w, h); initGel(w, h);
    state.loaded = true;
    for (const id of ["clearP", "clearG"]) $(id).disabled = false;
    drop.style.display = "none"; wrap.classList.add("on");
    $("dl").disabled = false;
    $("info").textContent = `${w} × ${h} px` + (k < 1 ? " (reducida al límite del navegador)" : "");
    render();
  } catch (e) { errEl.textContent = e.message; }
}

function render() {
  if (!state.loaded) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    gl.useProgram(prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, imgW, imgH);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, gelTex[gelCur]);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(U.tex, 0);
    setCommon(U);
    gl.uniform1f(U.showOrig, state.showOrig);
    gl.uniform1f(U.hasGel, state.hasGel ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  });
}

// ---- UI ----
$("vInt").textContent = (+$("int").value).toFixed(2);
$("vCov").textContent = (+$("cov").value).toFixed(2);
$("vRad").textContent = (+$("rad").value).toFixed(2);
$("vGrad").textContent = (+$("grad").value).toFixed(2);
$("vStr").textContent = (+$("gstr").value).toFixed(2);
for (const id of ["int", "cov", "rad", "grad", "gstr"]) {
  $(id).addEventListener("input", () => {
    $({int:"vInt", cov:"vCov", rad:"vRad", grad:"vGrad", gstr:"vStr"}[id]).textContent = (+$(id).value).toFixed(2);
    render();
  });
}
document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    state[seg.dataset.key] = +b.dataset.v;
    render();
  });
});
document.querySelectorAll("select[data-key]").forEach(sel =>
  sel.addEventListener("change", () => { state[sel.dataset.key] = +sel.value; render(); }));
$("seed").addEventListener("click", () => { state.seed = Math.round(Math.random() * 900) / 10 + 1; render(); });

const cmp = $("cmp");
const setOrig = v => { state.showOrig = v; render(); };
cmp.addEventListener("pointerdown", () => setOrig(1));
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) cmp.addEventListener(ev, () => setOrig(0));

// ---- pinceles (zona protegida y dedo sobre el gel) + deshacer unificado ----
const mk = $("mk"), mctx = mk.getContext("2d", { willReadFrequently: true }), ring = $("ring");
const history = [];                 // { kind: "mask" | "gel", snap }
let stroking = false, last = null, lastPtr = null;
const protectR = () => +$("rad").value / 2;     // los deslizadores son diámetros (fracción del alto)
const gelR = () => +$("grad").value / 2;
const toolR = () => state.tool === 2 ? gelR() : protectR();

function resetMask(w, h) {
  const k = Math.min(1, MASK_SIDE / Math.max(w, h));
  mk.width = Math.max(1, Math.round(w * k)); mk.height = Math.max(1, Math.round(h * k));
  mctx.clearRect(0, 0, mk.width, mk.height);
  history.length = 0;
  uploadMask(); syncUndo();
}
function uploadMask() {
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mk);
  gl.activeTexture(gl.TEXTURE0);
}
function syncUndo() { $("undo").disabled = history.length === 0; }
function pushHistory(kind) {
  history.push({ kind, snap: kind === "mask" ? mctx.getImageData(0, 0, mk.width, mk.height) : snapGel() });
  if (history.length > MAX_UNDO) history.shift();
  syncUndo();
}
function undo() {
  if (!history.length || stroking) return;
  const h = history.pop();
  if (h.kind === "mask") { mctx.putImageData(h.snap, 0, 0); uploadMask(); }
  else restoreGel(h.snap);
  syncUndo(); render();
}
function stamp(x, y) {
  const r = protectR() * mk.height;
  const g = mctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(255,50,50,1)"); g.addColorStop(.6, "rgba(255,50,50,1)"); g.addColorStop(1, "rgba(255,50,50,0)");
  mctx.fillStyle = g;
  mctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function uvPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
function paintTo(p) {                // p en uv; la máscara tiene su propia resolución
  const step = Math.max(1, protectR() * mk.height * .25);
  const a = { x: last.x * mk.width, y: last.y * mk.height }, b = { x: p.x * mk.width, y: p.y * mk.height };
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / step));
  for (let i = 1; i <= n; i++) stamp(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n);
  last = p;
  uploadMask(); render();
}
function dragGel(p) {                // empuja el gel a lo largo del trazo, en pasos pequeños
  const dx = p.x - last.x, dy = p.y - last.y, r = gelR(), str = +$("gstr").value;
  const n = Math.min(40, Math.max(1, Math.ceil(Math.hypot(dx * imgW / imgH, dy) / (r * .2))));
  for (let i = 1; i <= n; i++)
    pushStep(last.x + dx * (i - .5) / n, last.y + dy * (i - .5) / n, dx / n * str, dy / n * str, r);
  state.hasGel = true;
  last = p;
  render();
}
function placeRing(e) {
  const r = cv.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const d = 2 * toolR() * r.height;
  ring.style.width = ring.style.height = d + "px";
  ring.style.transform = `translate(${e.clientX - w.left - d / 2}px, ${e.clientY - w.top - d / 2}px)`;
}
function refreshRing() { if (state.tool && lastPtr) placeRing(lastPtr); }
$("rad").addEventListener("input", refreshRing);
$("grad").addEventListener("input", refreshRing);

document.querySelector('.seg[data-key="tool"]').addEventListener("click", () => {
  cv.classList.toggle("brush", state.tool > 0);
  if (!state.tool) ring.style.display = "none"; else refreshRing();
});
cv.addEventListener("pointerdown", e => {
  if (!state.tool || !state.loaded || e.button > 0) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  last = uvPos(e); stroking = true;
  if (state.tool === 1) { pushHistory("mask"); paintTo(last); }
  else pushHistory("gel");
});
cv.addEventListener("pointermove", e => {
  lastPtr = e;
  if (!state.tool) return;
  ring.style.display = "block"; placeRing(e);
  if (!stroking) return;
  if (state.tool === 1) paintTo(uvPos(e)); else dragGel(uvPos(e));
});
const endStroke = () => { stroking = false; };
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("pointerleave", () => { if (!stroking) ring.style.display = "none"; });
$("undo").addEventListener("click", undo);
$("clearP").addEventListener("click", () => {
  if (!state.loaded) return;
  pushHistory("mask"); mctx.clearRect(0, 0, mk.width, mk.height); uploadMask(); render();
});
$("clearG").addEventListener("click", () => {
  if (!state.loaded) return;
  pushHistory("gel"); restoreGel(zeroGelData()); render();
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
});

$("dl").addEventListener("click", () => {
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    cv.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = "refraccion-liquida.png"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  }));
});

const fileIn = $("file");
const pick = () => fileIn.click();
$("open").addEventListener("click", pick);
drop.addEventListener("click", pick);
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") pick(); });
fileIn.addEventListener("change", () => { const f = fileIn.files[0]; if (f) loadImage(f); });
for (const t of [document.body]) {
  t.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  t.addEventListener("dragleave", () => drop.classList.remove("over"));
  t.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer.files[0];
    if (f) loadImage(f);
  });
}

initGL();
</script>
</body>
</html>
