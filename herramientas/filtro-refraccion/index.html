<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efectos de imagen</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #dcdcd6; --accent: #1d1d1b; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --panel: #1b1b1a; --text: #ecece8; --muted: #9a9a94;
      --line: #333330; --accent: #ecece8; --accent-text: #121212;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; min-height: 100vh; }
  .stage { display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; }
  .canvas-wrap { position: relative; max-width: 100%; max-height: calc(100vh - 32px); display: none; }
  .canvas-wrap.on { display: block; }
  canvas { display: block; max-width: 100%; max-height: calc(100vh - 32px); width: auto; height: auto;
    border-radius: 6px; background: #000; touch-action: manipulation; }
  .drop { width: min(520px, 100%); border: 2px dashed var(--line); border-radius: 12px; padding: 48px 24px;
    text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--text); color: var(--text); }
  .drop strong { display: block; font-size: 18px; color: var(--text); margin-bottom: 6px; }
  #mk { display: none; position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; pointer-events: none;
    background: transparent; border-radius: 6px; opacity: 0; }
  #ring { position: absolute; left: 0; top: 0; border: 1.5px solid rgba(255,255,255,.85); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); pointer-events: none; display: none; }
  canvas#cv.brush { cursor: none; touch-action: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; max-height: 100vh; }
  h1 { font-size: 17px; margin: 0 0 14px; }
  .ctl { margin-bottom: 14px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 7px 4px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .btn { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 10px; border-radius: 8px; font: inherit; cursor: pointer; margin-bottom: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row .btn { margin-bottom: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .err { color: #b3261e; font-size: 13px; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 14px; }
  .crow { display: grid; grid-template-columns: 34px 1fr; gap: 2px 6px; align-items: center; min-width: 0; }
  .crow label { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .crow input[type=color] { width: 32px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer; }
  .crow input[type=text] { min-width: 0; width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); font: 12px ui-monospace, monospace; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 14px; }
  .grid2 .ctl { margin: 0; min-width: 0; }
  .grid2 label { font-size: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .grid3 .ctl { margin: 0; min-width: 0; }
  .grid3 label { font-size: 12px; }
  select { width: 100%; padding: 6px 4px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
    color: var(--text); font: inherit; font-size: 13px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: none; }
    .canvas-wrap, canvas { max-height: 60vh; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong>Elige o arrastra una imagen</strong>
      JPG, PNG o WebP. Se procesa en tu navegador; la imagen no se sube a ningún servidor.
    </div>
    <div class="canvas-wrap" id="wrap"><canvas id="cv"></canvas><canvas id="mk"></canvas><div id="ring"></div></div>
    <input type="file" id="file" accept="image/*,.heic,.heif" hidden>
  </main>

  <aside>
    <h1>Efectos de imagen</h1>
    <div class="row">
      <button class="btn" id="seedPrev" title="Volver al patrón anterior" aria-label="Patrón anterior" style="flex:0 0 46px" disabled>←</button>
      <button class="btn" id="seed">Nuevo patrón</button>
      <button class="btn" id="seedNext" title="Ir al patrón siguiente" aria-label="Patrón siguiente" style="flex:0 0 46px" disabled>→</button>
    </div>
    <div class="ctl"><div class="seg" data-key="effect"><button data-v="0" class="on">Sesgo líquido</button><button data-v="1">Memoria mineral</button><button data-v="2">Óxido solar</button></div></div>
    <button class="btn" id="open">Cambiar imagen</button>

    <div id="fxLiquid">
    <div class="ctl"><label>Intensidad <span id="vInt"></span></label>
      <input type="range" id="int" min="0" max="1" step="0.01" value="0.60"></div>
    <div class="ctl"><label>Cobertura <span id="vCov"></span></label>
      <input type="range" id="cov" min="0" max="1" step="0.01" value="0.60"></div>
    <div class="ctl" title="Cuánto se corre cada pieza delimitada por los pliegues respecto a las vecinas"><label>Desplazamiento <span id="vsDesp"></span></label>
      <input type="range" id="sDesp" min="0" max="1" step="0.01" value="0.25"></div>

    <div class="grid3">
      <div class="ctl"><label for="selSize">Pliegue</label>
        <select id="selSize" data-key="size"><option value="0" selected>Amplio</option><option value="1">Fino</option><option value="2">Mixto</option></select></div>
      <div class="ctl"><label for="selDir">Dirección</label>
        <select id="selDir" data-key="dir"><option value="0">Horizontal</option><option value="1">Diagonal</option><option value="2" selected>Libre</option></select></div>
      <div class="ctl"><label for="selDup">Duplicación</label>
        <select id="selDup" data-key="dup"><option value="0">Ninguna</option><option value="1" selected>Sutil</option><option value="2">Marcada</option></select></div>
    </div>
    </div>

    <div id="fxOxido" hidden>
      <div class="colors" id="oColors">
        <div class="crow"><label for="cS">Sombra</label><input type="color" id="cS" value="#0a2530"><input type="text" id="hS" value="#0a2530" maxlength="7" spellcheck="false" aria-label="Hex sombra"></div>
        <div class="crow"><label for="cM">Medio</label><input type="color" id="cM" value="#2a7f8c"><input type="text" id="hM" value="#2a7f8c" maxlength="7" spellcheck="false" aria-label="Hex medio"></div>
        <div class="crow"><label for="cL">Luz</label><input type="color" id="cL" value="#efe3c8"><input type="text" id="hL" value="#efe3c8" maxlength="7" spellcheck="false" aria-label="Hex luz"></div>
        <div class="crow"><label for="cA">Acento</label><input type="color" id="cA" value="#e8702a"><input type="text" id="hA" value="#e8702a" maxlength="7" spellcheck="false" aria-label="Hex acento"></div>
        <div class="crow"><label for="cC">Borde frío</label><input type="color" id="cC" value="#5fd0d8"><input type="text" id="hC" value="#5fd0d8" maxlength="7" spellcheck="false" aria-label="Hex borde frío"></div>
      </div>
      <div class="grid2">
        <div class="ctl" title="Cuántos colores usa la imagen"><label for="selOTones">Tonos</label>
          <select id="selOTones" data-key="oTones"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div>
        <div class="ctl" title="Hacia dónde se estiran las luces"><label for="selODir">Barrido</label>
          <select id="selODir" data-key="oDir"><option value="0">Izquierda</option><option value="1">Derecha</option><option value="2" selected>Ambos</option></select></div>
      </div>
      <div class="grid3">
        <div class="ctl" title="Cuánto se estira el barrido horizontal"><label>Longitud <span id="voLen"></span></label>
          <input type="range" id="oLen" min="0" max="1" step="0.01" value="0.22"></div>
        <div class="ctl" title="Variación del largo entre filas: más = bordes en peine"><label>Aspereza <span id="voRough"></span></label>
          <input type="range" id="oRough" min="0" max="1" step="0.01" value="0.66"></div>
        <div class="ctl" title="Solo las luces se estiran ↔ toda la imagen"><label>Alcance <span id="voReach"></span></label>
          <input type="range" id="oReach" min="0" max="1" step="0.01" value="0.37"></div>
        <div class="ctl" title="Desplaza qué es sombra, medio y luz"><label>Umbral <span id="voThr"></span></label>
          <input type="range" id="oThr" min="-0.3" max="0.3" step="0.01" value="0.03"></div>
        <div class="ctl" title="Borde entre tonos: duro o difuso"><label>Suavidad <span id="voSoft"></span></label>
          <input type="range" id="oSoft" min="0" max="1" step="0.01" value="1.00"></div>
        <div class="ctl" title="Brillo del resplandor alrededor de las luces"><label>Halo <span id="voHalo"></span></label>
          <input type="range" id="oHalo" min="0" max="1" step="0.01" value="0.64"></div>
        <div class="ctl" title="Suavidad de la franja de color: nítida o difusa"><label>Suav. borde <span id="voEdgeS"></span></label>
          <input type="range" id="oEdgeS" min="0" max="1" step="0.01" value="0.35"></div>
        <div class="ctl" title="Cuánto se extiende el halo"><label>R. halo <span id="voHaloR"></span></label>
          <input type="range" id="oHaloR" min="0" max="1" step="0.01" value="0.47"></div>
        <div class="ctl" title="Fuerza de la franja de color junto a los negros"><label>Borde <span id="voEdge"></span></label>
          <input type="range" id="oEdge" min="0" max="1" step="0.01" value="0.12"></div>
        <div class="ctl" title="Ancho de la franja de color"><label>Grosor <span id="voEdgeW"></span></label>
          <input type="range" id="oEdgeW" min="0" max="1" step="0.01" value="0.83"></div>
        <div class="ctl" title="Cantidad de grano"><label>Grano <span id="voGrain"></span></label>
          <input type="range" id="oGrain" min="0" max="1" step="0.01" value="0.28"></div>
        <div class="ctl" title="Tamaño del grano"><label>Tam. gr. <span id="voGrainS"></span></label>
          <input type="range" id="oGrainS" min="0" max="1" step="0.01" value="0.11"></div>
      </div>
    </div>

    <div id="fxMineral" hidden>
      <div class="grid2">
        <div class="ctl" title="Cuántas piezas y grietas: pocas piezas grandes o muchas pequeñas"><label>Fractura <span id="vmRet"></span></label>
          <input type="range" id="mRet" min="0" max="1" step="0.01" value="1.00"></div>
        <div class="ctl" title="Cuánto se desplaza cada pieza respecto a las vecinas"><label>Desplazamiento <span id="vmPose"></span></label>
          <input type="range" id="mPose" min="0" max="1" step="0.01" value="0.70"></div>
        <div class="ctl" title="Cuánto se curvan y retuercen las grietas y las bandas"><label>Flujo <span id="vmTwist"></span></label>
          <input type="range" id="mTwist" min="0" max="1" step="0.01" value="1.00"></div>
        <div class="ctl" title="Cuántas ramificaciones finas salen de las grietas"><label>Ramificación <span id="vmEro"></span></label>
          <input type="range" id="mEro" min="0" max="1" step="0.01" value="1.00"></div>
        <div class="ctl" title="Cantidad y grosor de las vetas de color"><label>Vetas <span id="vmCov"></span></label>
          <input type="range" id="mCov" min="0" max="1" step="0.01" value="0.02"></div>
        <div class="ctl" title="Cuántas bandas de color/vetas de nivel aparecen"><label>Bandas <span id="vmScale"></span></label>
          <input type="range" id="mScale" min="0" max="1" step="0.01" value="0.47"></div>
        <div class="ctl" title="Gira el matiz (hue) de todos los colores del resultado"><label>Matiz <span id="vmHue"></span></label>
          <input type="range" id="mHue" min="-180" max="180" step="1" value="0"></div>
      </div>
      <div class="hint" style="margin:0 0 4px">Solo las vetas</div>
      <div class="grid3">
        <div class="ctl" title="Gira el matiz (hue) solo de las vetas"><label>Matiz <span id="vmVHue"></span></label>
          <input type="range" id="mVHue" min="-180" max="180" step="1" value="0"></div>
        <div class="ctl" title="Aclara u oscurece solo las vetas"><label>Tono <span id="vmVTone"></span></label>
          <input type="range" id="mVTone" min="-1" max="1" step="0.01" value="0.00"></div>
        <div class="ctl" title="Contraste solo de las vetas"><label>Contraste <span id="vmVCon"></span></label>
          <input type="range" id="mVCon" min="-1" max="1" step="0.01" value="0.00"></div>
      </div>
    </div>

    <hr class="sep">
    <div id="brushPanel">
    <div class="ctl"><label>Herramienta de pincel</label>
      <div class="seg" data-key="tool"><button data-v="0" class="on">Ninguna</button><button data-v="1">Proteger</button><button data-v="2">Mover gel</button></div></div>

    <div class="grid3">
      <div class="ctl" title="Diámetro del dedo al mover el gel. En Sesgo líquido empuja los pliegues sin mover la foto; en los otros efectos arrastra la imagen"><label>Dedo <span id="vGrad"></span></label>
        <input type="range" id="grad" min="0.04" max="0.8" step="0.005" value="0.25"></div>
      <div class="ctl" title="Diámetro del pincel Proteger: pinta sobre ojos, texto o producto y empuja los pliegues hacia afuera (en Sesgo líquido)"><label>Zona <span id="vRad"></span></label>
        <input type="range" id="rad" min="0.02" max="0.6" step="0.005" value="0.12"></div>
      <div class="ctl" title="Fuerza del dedo (Mover gel) y del empuje del pincel Proteger. Menos de 1: parcial. Más de 1: más lejos"><label>Fuerza <span id="vStr"></span></label>
        <input type="range" id="gstr" min="0.2" max="2" step="0.05" value="1"></div>
    </div>

    <div class="row"><button class="btn" id="undo" disabled>Deshacer (Ctrl/Cmd+Z)</button></div>
    <div class="row">
      <button class="btn" id="clearP" disabled>Borrar zona protegida</button>
      <button class="btn" id="clearG" disabled>Restablecer gel</button>
    </div>
    </div>

    <hr class="sep">
    <div class="row">
      <button class="btn primary" id="apply" disabled title="Fija el resultado como imagen base para aplicarle otro filtro encima">Aplicar filtro</button>
      <button class="btn" id="unapply" disabled title="Quita el último filtro aplicado">Quitar último</button>
    </div>
    <p class="hint" id="stackInfo" style="margin:-2px 0 8px"></p>
    <button class="btn" id="cmp">Mantén pulsado: ver original</button>
    <button class="btn primary" id="dl" disabled>Descargar PNG</button>
    <p class="hint" id="info"></p>
    <p class="err" id="err"></p>
  </aside>
</div>

<script>
"use strict";
const MASK_SIDE = 768;   // resolución de la máscara del pincel
const MAX_UNDO = 40;
const MAX_SIDE = 3072;
const GEL_SIDE = 512;    // resolución del campo del gel

const VERT = `
attribute vec2 a;
varying vec2 vUv;
void main(){ vUv = vec2(a.x*0.5+0.5, 0.5-a.y*0.5); gl_Position = vec4(a,0.,1.); }`;

const COMMON = `
precision highp float;
varying vec2 vUv;
uniform float aspect, seed;
uniform sampler2D mask;            // alfa = zona protegida (pincel)
uniform sampler2D ufield;          // desplazamiento del gel movido con el dedo (16 bits por eje): mueve imagen y pliegues
uniform sampler2D efield;          // desplazamiento extra solo de los pliegues (empuje del pincel Proteger)
uniform vec2 uTexel;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+vec2(17.7,93.1))); }

// ruido de valor suave (C2)
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.-15.)+10.);
  float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float s = 0., a = .5;
  for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 11.7; a *= .5; }
  return s;
}

vec2 mirror(vec2 uv){ return 1. - abs(1. - mod(uv, 2.)); }

float protect(vec2 uv){ return 1. - texture2D(mask, uv).a; }

// campo del gel movido: dos canales de 8 bits por eje (RGBA8 sirve en cualquier GPU)
const float UR = 1.;
vec2 decodeU(vec4 t){ t = floor(t*255. + .5); return ((vec2(t.x,t.z)*256. + vec2(t.y,t.w)) - 32768.)/32768.*UR; }
vec2 fetchF(sampler2D s, vec2 tc){ return decodeU(texture2D(s, tc)); }
vec2 getF(sampler2D s, vec2 uv){       // bilineal manual (las texturas son NEAREST)
  vec2 tc = vec2(uv.x, 1.-uv.y);
  vec2 st = tc/uTexel - .5; vec2 i = floor(st), f = fract(st);
  vec2 a = fetchF(s, (i+vec2(.5,.5))*uTexel), b = fetchF(s, (i+vec2(1.5,.5))*uTexel);
  vec2 c = fetchF(s, (i+vec2(.5,1.5))*uTexel), d = fetchF(s, (i+vec2(1.5,1.5))*uTexel);
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
vec2 getU(vec2 uv){ return getF(ufield, uv); }
vec2 getE(vec2 uv){ return getF(efield, uv); }`;

const SESGO = `
uniform float intensity, coverage, sizeMix, dirMode, dupAmt, dispAmt;
// "grosor" de la lámina transparente en el punto p (espacio con alto = 1)
float height(vec2 p){
  // orientación de los pliegues
  float ang = dirMode < .5 ? 0.0 : (dirMode < 1.5 ? -0.62 + 0.25*(vnoise(vec2(seed*.37,1.))-.5) : (fbm(p*.7+seed)-.5)*4.2);
  float c = cos(ang), s = sin(ang);
  vec2 q = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
  q.x *= .42;                       // alarga los pliegues a lo largo de la dirección
  q += seed*3.1;
  // domain warp: rompe cualquier regularidad (ni senoidal ni concéntrico)
  vec2 w = vec2(fbm(q*1.1), fbm(q*1.1+7.3)) - .5;
  q += w*2.2;
  float coarse = fbm(q*1.5);
  float fine   = fbm(q*4.6 + 3.0);
  float rid    = 1. - abs(2.*fbm(q*2.7+9.1) - 1.);
  float wc = sizeMix < .5 ? 1. : (sizeMix < 1.5 ? .12 : .55);
  float wf = sizeMix < .5 ? .1 : (sizeMix < 1.5 ? 1. : .55);
  float h = wc*coarse + wf*(.5*fine + .6*rid*rid) ;
  // plegado: invierte localmente el desplazamiento => fragmentos duplicados
  h += dupAmt * .05 * sin(h*38. + 5.*coarse);
  return h;
}

float coverMask(vec2 p){
  float n = fbm(p*1.15 + seed*1.7 + 40.);
  float lo = mix(.6, -.12, coverage);
  return smoothstep(lo, lo+.22, n);
}

`;

// Empuje del dedo. Hay dos campos: O (mueve imagen y pliegues) y E (solo pliegues).
//  uMode 0, "arrastrar" solo los pliegues (Mover gel en Sesgo líquido): E' (x) = (q - x) + O(q) - O(x) + E(q), con q = x - v·w
//  uMode 3, "arrastrar" imagen y pliegues (otros efectos): O' (x) = q + O(q) - x   y   E' (x) = E(q)
//  uMode 2, "suavizar" (solo E): promedia el empuje para que la cresta sea ancha, como un gel espeso.
//  uMode 1, "empujar hacia fuera" (Proteger): solo cambia E, con q = x - (x-c)·s·w:
//           los pliegues se corren hacia afuera del pincel y la foto no se mueve.
const PUSH = COMMON + `
uniform vec2 pc, pv;
uniform float pr, uMode, uSel;
void main(){
  vec2 tc = gl_FragCoord.xy * uTexel;
  vec2 uv = vec2(tc.x, 1.-tc.y);
  float t = length((uv - pc) * vec2(aspect, 1.)) / pr;
  vec4 raw = uSel > .5 ? texture2D(efield, tc) : texture2D(ufield, tc);
  if(t >= 1.){ gl_FragColor = raw; return; }     // copia exacta fuera del pincel
  float w = 1. - t*t; w *= w;
  vec2 q = (uMode < .5 || uMode > 2.5) ? uv - pv*w : uv - (uv - pc)*pv.x*w;
  vec2 nu;
  if(uSel > .5 && uMode > 1.5){                                          // E: suavizado (gel más espeso)
    vec2 acc = vec2(0.);
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++) acc += getE(uv + vec2(float(i), float(j))*uTexel*pv.x);
    nu = mix(getE(uv), acc/9., clamp(w*1.6, 0., 1.));
  }
  else if(uSel < .5) nu = q + getU(q) - uv;                                   // O (solo en modo arrastrar)
  else if(uMode > 2.5) nu = getE(q);                                     // E acompaña a la imagen (O se arrastra)
  else nu = (q - uv) + getU(q) - getU(uv) + getE(q);                     // E al empujar hacia fuera
  nu = clamp(nu, -UR, UR);
  vec2 n = clamp(floor(nu/UR*32768. + 32768. + .5), 0., 65535.);
  vec2 hi = floor(n/256.), lo = n - hi*256.;
  gl_FragColor = vec4(hi.x, lo.x, hi.y, lo.y) / 255.;
}`;

const FRAG = COMMON + SESGO + `
uniform sampler2D tex;
uniform float showOrig, hasGel;

// campo de desplazamiento (en uv) + diagnóstico para bordes
void field(vec2 p, float prot, out vec2 d, out float edge, out vec2 off, out float cut){
  float e = .0025;
  float h  = height(p);
  float hx = height(p+vec2(e,0.)), hxm = height(p-vec2(e,0.));
  float hy = height(p+vec2(0.,e)), hym = height(p-vec2(0.,e));
  vec2 g = vec2(hx-hxm, hy-hym)/(2.*e);
  float lap = (hx+hxm+hy+hym-4.*h)/(e*e);
  float amp = intensity * coverMask(p) * prot;
  d = -g * (.034*amp);
  d /= 1. + length(d)/.06;          // límite suave: evita zonas ilegibles
  d.x /= aspect;
  edge = clamp(lap*.00055*amp*(.4+intensity), -1., 1.);

  // desplazamiento entre piezas: las zonas entre líneas de nivel del pliegue se corren unas de otras
  float cov = coverMask(p) * prot;
  float K = 7.;
  float id = floor(h*K);
  float fr = h*K - id;
  vec2 hp = hash2(vec2(id, seed));
  off = (hp - .5) * 2. * dispAmt * .07 * cov;
  off.x /= aspect;
  float dist = min(fr, 1. - fr) / (K*max(length(g), .2));
  cut = (1. - smoothstep(0., .0035, dist)) * cov * min(dispAmt*3., 1.);
}

void main(){
  vec2 uv = vUv;
  if(showOrig > .5){ gl_FragColor = texture2D(tex, uv); return; }
  vec2 Mi = uv, Mf = uv;                          // Mi: de dónde sale la foto; Mf: dónde están los pliegues
  if(hasGel > .5){ Mi = uv + getU(uv); Mf = Mi + getE(uv); }
  vec2 p = Mf * vec2(aspect, 1.);
  float pm = protect(uv);

  vec2 d, off; float edge, cut;
  field(p, pm, d, edge, off, cut);

  vec3 col = texture2D(tex, mirror(Mi + d + off)).rgb;
  col *= 1. - .4*cut;                            // corte visible entre piezas

  // bordes líquidos finos: claro en una cara de la cresta, oscuro en la otra
  float hi = max(edge, 0.), lo = max(-edge, 0.);
  col = mix(col, col + (1.-col)*.55, clamp(hi,0.,1.));
  col *= 1. - .45*clamp(lo,0.,1.);

  gl_FragColor = vec4(clamp(col,0.,1.), 1.);
}`;


// ===== Memoria mineral: la foto se fractura como un mármol hecho de sus propios colores =====
// Red de grietas curvas (Worley sobre un espacio doblado y alargado por el flujo) -> piezas.
// Cada pieza muestra la foto desplazada o una versión estirada de sus colores. Las grietas y las
// líneas de nivel del flujo se rellenan con vetas pintadas con la paleta dominante de la foto.
const FRAG2 = COMMON + `
uniform sampler2D tex;
uniform float showOrig, hasGel;
uniform float mRet, mPose, mHue, mTwist, mEro, mCov, mScale, mVHue, mVTone, mVCon;
uniform vec3 palD, palL, pal0, pal1, pal2;       // oscuro, claro y 3 dominantes de la foto

float a0(){ return seed*1.7 + .6; }              // dirección general del flujo
vec2 rot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }

// espacio doblado: el flujo curva y alarga todo (grietas, bandas, vetas) en la misma dirección
vec2 warpQ(vec2 p){
  float warp = mix(.5, 2.6, mTwist);
  vec2 q = rot(p, -a0()); q.x *= .6; q += seed*3.1;
  q += (vec2(fbm(q*.9), fbm(q*.9 + 4.1)) - .5) * warp;
  q += (vec2(fbm(q*1.7 + 9.), fbm(q*1.7 + 2.)) - .5) * warp * .5;
  return q;
}
float Fq(vec2 q){ return .6*fbm(q*1.1) + .4*fbm(q*2.7 + 3.); }   // campo de bandas del mármol

// distancia a la grieta más cercana (F2-F1, en unidades de celda) y celda de la pieza
float worley(vec2 x, out vec2 cell){
  vec2 n = floor(x), f = fract(x);
  float f1 = 8., f2 = 8.; cell = n;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + hash2(n + g) - f;
    float d = dot(r, r);
    if(d < f1){ f2 = f1; f1 = d; cell = n + g; } else if(d < f2) f2 = d;
  }
  return sqrt(f2) - sqrt(f1);
}

vec3 veinColor(vec2 p, vec2 q){
  vec3 c = mix(pal0, pal1, smoothstep(.3, .7, fbm(q*.8 + 5.)));
  return mix(c, pal2, smoothstep(.55, .8, fbm(q*1.4 + 13.)) * .8);
}

void main(){
  vec2 uv = vUv;
  if(showOrig > .5){ gl_FragColor = texture2D(tex, uv); return; }
  vec2 M = hasGel > .5 ? uv + getU(uv) : uv;
  vec2 p = M * vec2(aspect, 1.);
  float pm = protect(uv);                       // zona protegida: sin fractura, sin vetas
  vec2 asp = vec2(aspect, 1.);

  vec2 q = warpQ(p);

  // ---- grietas: red grande + red fina intermitente (ramificaciones) ----
  float cs  = mix(3., 9., mRet);
  vec2 cell, cell2;
  float dBig  = worley(q*cs, cell) / cs;
  float dFine = worley(q*cs*2.6 + 7., cell2) / (cs*2.6);
  float gate2 = smoothstep(mix(.82, .38, mEro), mix(.82, .38, mEro) + .12, fbm(q*1.5 + 11.));
  float dCrack = min(dBig, dFine + (1. - gate2)*10.);

  // ---- pieza: desplazamiento propio y estado (foto / mineral) ----
  vec2 hp = hash2(cell);
  vec2 off = (hp - .5) * 2. * mPose * .08 * pm;
  vec3 photo = texture2D(tex, mirror((p + off) / asp)).rgb;
  float K = mix(6., 16., mScale);
  float F = Fq(q);
  vec3 col = photo;                              // la foto siempre es legible: solo se fractura y se desplaza


  // ---- vetas ----
  float wBase = mix(.0028, .014, mCov);
  float wv = wBase * (.25 + 1.9*fbm(q*2.1 + 17.));
  float pool = smoothstep(.58, .70, fbm(q*.9 + 19.));                 // charcos gruesos de veta
  float gate = smoothstep(mix(.6, .22, mCov), mix(.6, .22, mCov) + .15, fbm(q*1.2 + 3.));
  float crackVein = (1. - smoothstep(0., wv*(1. + 7.*pool), dCrack)) * gate;

  // líneas de nivel del flujo: solo algunas son vetas, y solo por tramos
  float c = F*K, ci = floor(c);
  float e = .02;
  vec2 gF = vec2(Fq(q + vec2(e, 0.)) - F, Fq(q + vec2(0., e)) - F) / e;
  float dLine = abs(fract(c) - .5);
  dLine = (.5 - dLine) / (K * max(length(gF), .05));                   // distancia a la línea, en espacio q
  float vis = step(1. - mix(.12, .5, mCov), hash(vec2(ci, seed)));
  float along = smoothstep(.45, .62, fbm(q*2. + ci*3.1));
  float lineVein = (1. - smoothstep(0., wBase*.7, dLine)) * vis * along;

  float va = clamp(max(crackVein, lineVein), 0., 1.) * pm;

  // la grieta sin veta se lee como borde sombreado entre piezas
  col *= 1. - .35*(1. - smoothstep(0., wBase*2.5, dCrack)) * pm * (1. - va);

  vec3 vc = veinColor(p, q);
  vec3 core = mix(vc, palL, .5);
  float coreMask = 1. - smoothstep(0., .45, 1. - va);                   // núcleo más claro y fino
  vec3 vcol = mix(vc, core, coreMask);
  float vha = mVHue * .0174533;                                         // matiz solo de las vetas
  const vec3 kv = vec3(.57735);
  vcol = vcol*cos(vha) + cross(kv, vcol)*sin(vha) + kv*dot(kv, vcol)*(1. - cos(vha));
  vcol = mix(vcol, mVTone > 0. ? vec3(1.) : vec3(0.), abs(mVTone)*.8);  // tono: hacia claro u oscuro
  vcol = clamp((vcol - .5)*(mVCon > 0. ? 1. + mVCon*1.4 : 1. + mVCon*.8) + .5, 0., 1.);
  float glit = .9 + .2*hash(floor(p*1100.));                           // grano fino de la veta
  col = mix(col, vcol*glit, va);
  col *= 1. - .22*smoothstep(.0, .5, va)*(1.-smoothstep(.5, 1., va));    // halo oscuro de relieve

  // matiz: giro de color alrededor del eje gris (preserva luminosidad aproximada)
  float ha = mHue * .0174533, ca = cos(ha), sa = sin(ha);
  const vec3 kk = vec3(.57735);
  col = col*ca + cross(kk, col)*sa + kk*dot(kk, col)*(1. - ca);

  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

// ===== Óxido solar: foto reducida a pocos tonos fijos, con barrido horizontal, halo, borde de color y grano =====
const FRAG3 = COMMON + `
uniform sampler2D tex;
uniform float showOrig, hasGel;
uniform float oLen, oRough, oReach, oThr, oSoft, oHalo, oHaloR, oEdge, oEdgeW, oEdgeS, oGrain, oGrainS, oTones, oDir;
uniform vec3 pS, pM, pL, pA, pC;                // sombra, medio, luz, acento (halo y borde cálido), borde frío
uniform vec2 uRes;
uniform float uLo, uHi;                         // rango de luminosidad de la foto (percentiles 3 y 97)

float lumAt(vec2 uv){ return dot(texture2D(tex, mirror(uv)).rgb, vec3(.2126, .7152, .0722)); }
float nrm(float y){ return clamp((y - uLo) / max(uHi - uLo, .05), 0., 1.); }

void main(){
  vec2 uv = vUv;
  if(showOrig > .5){ gl_FragColor = texture2D(tex, uv); return; }
  vec2 M = uv;                                   // este efecto no usa gel ni zona protegida
  float pm = 1.;

  // ---- barrido horizontal: la longitud varía fila a fila (bordes en peine) y crece con la luz ----
  float rows = 520.;
  float ry = floor(M.y*rows);
  float rA = hash(vec2(ry, seed)), rB = hash(vec2(ry + 17.3, seed*1.7));
  float rS = vnoise(vec2(M.y*rows*.35, seed));
  float rowVar = mix(1., .1 + 1.8*(.35*rA + .65*rS), oRough);
  float y0 = nrm(lumAt(M));
  float reach = mix(smoothstep(.45, .85, y0), 1., oReach);
  float len = oLen*.3*rowVar*reach*pm;
  float a = oDir > .5 ? (oDir > 1.5 ? len*(.3 + .7*rA) : len) : 0.;   // hacia la derecha
  float b = oDir < .5 ? len : (oDir > 1.5 ? len*(.3 + .7*rB) : 0.);   // hacia la izquierda
  float acc = pow(y0, 4.), ws = 1.;
  for(int i=0;i<16;i++){
    float t = (float(i) + .5)/16.;
    float w = 1. - t*t;
    acc += w*pow(nrm(lumAt(M + vec2(t*b, 0.))), 4.) + w*pow(nrm(lumAt(M - vec2(t*a, 0.))), 4.);
    ws += 2.*w;
  }
  float Y = pow(acc/ws, .25);                    // media de potencia: las luces se imponen y se estiran

  // ---- mapeo a 2, 3 o 4 tonos con borde suave ----
  float w = mix(.01, .22, oSoft);
  vec3 col;
  if(oTones < 2.5){
    col = mix(pS, pL, smoothstep(.5 + oThr - w, .5 + oThr + w, Y));
  } else if(oTones < 3.5){
    col = mix(pS, pM, smoothstep(.33 + oThr - w, .33 + oThr + w, Y));
    col = mix(col, pL, smoothstep(.66 + oThr - w, .66 + oThr + w, Y));
  } else {
    col = mix(pS, pM, smoothstep(.25 + oThr - w, .25 + oThr + w, Y));
    col = mix(col, pA, smoothstep(.5 + oThr - w, .5 + oThr + w, Y));
    col = mix(col, pL, smoothstep(.75 + oThr - w, .75 + oThr + w, Y));
  }

  // ---- halo: las luces se esparcen alrededor con el color de acento ----
  float R = oHaloR*.1;
  float H = 0.;
  for(int i=0;i<16;i++){
    float r = sqrt((float(i) + .5)/16.)*R, an = float(i)*2.39996;
    vec2 off = vec2(cos(an)*1.5/aspect, sin(an))*r;
    H += smoothstep(.55, .9, nrm(lumAt(M + off)));
  }
  H /= 16.;
  float ha = clamp(H*oHalo*1.6, 0., 1.) * (1. - smoothstep(.55, .85, Y));
  col = mix(col, pA, ha);

  // ---- borde de color: franja fina junto a los negros, cálida de un lado y fría del otro ----
  float d = .002 + oEdgeW*.012;
  vec2 ex = vec2(d/aspect, 0.), ey = vec2(0., d);
  float gx = nrm(lumAt(M + ex)) - nrm(lumAt(M - ex));
  float gy = nrm(lumAt(M + ey)) - nrm(lumAt(M - ey));
  float mag = clamp(abs(gx) + abs(gy)*.7, 0., 1.);
  float rim = smoothstep(.12*(1. - oEdgeS), .45 + .55*oEdgeS, mag) * (1. - smoothstep(.3, .6 + .3*oEdgeS, y0)) * oEdge;   // oEdgeS: franja nítida ↔ difusa
  col = mix(col, (gx + gy*.5) > 0. ? pA : pC, clamp(rim, 0., 1.));

  // ---- grano uniforme, más marcado en medios tonos ----
  float cell = max(1., mix(1., 3.5, oGrainS) * uRes.y/1200.);
  vec2 gp = floor(gl_FragCoord.xy/cell);
  vec3 gg = vec3(hash(gp + seed), hash(gp + vec2(7.1, 3.3) + seed), hash(gp + vec2(1.9, 9.7) + seed)) - .5;
  float lo = dot(col, vec3(.3, .59, .11));
  float amt = oGrain*.5*(.45 + .55*(1. - abs(2.*lo - 1.)));
  col += (gg.x*.75 + gg*.25) * amt;

  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

const $ = id => document.getElementById(id);
const cv = $("cv"), wrap = $("wrap"), drop = $("drop"), errEl = $("err");
const state = { size: 0, dir: 2, dup: 1, seed: 1.0, tool: 0, effect: 0, oTones: 3, oDir: 2, lum: [0, 1], hasGel: false, pal: [[0,0,0],[1,1,1],[.8,.6,.2],[.5,.5,.5],[.7,.3,.2]], loaded: false, showOrig: 0 };

let gl, prog, prog2, prog3, pushProg, tex, maskTex, U = {}, U2 = {}, U3 = {}, PL = {}, gelTex = [null, null], gelFbo = [null, null], gelCur = 0, eTex = [null, null], eFbo = [null, null], eCur = 0, uw = 1, uh = 1, imgW = 0, imgH = 0, raf = 0;

function makeProgram(fragSrc) {
  const sh = (t, src) => {
    const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x));
    return x;
  };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(p, 0, "a");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const locs = (p, names) => Object.fromEntries(names.map(n => [n, gl.getUniformLocation(p, n)]));
const MIN_IDS = ["mRet", "mPose", "mHue", "mTwist", "mEro", "mCov", "mScale", "mVHue", "mVTone", "mVCon"];
const PAL_IDS = ["palD", "palL", "pal0", "pal1", "pal2"];
const OX_IDS = ["oLen", "oRough", "oReach", "oThr", "oSoft", "oHalo", "oHaloR", "oEdge", "oEdgeW", "oEdgeS", "oGrain", "oGrainS"];
const OX_PAL = ["pS", "pM", "pL", "pA", "pC"];
// paletas fijas (colores tomados a ojo de las referencias): sombra, medio, luz, acento, borde frío
const OX_KEYS = ["S", "M", "L", "A", "C"];                      // sombra, medio, luz, acento, borde frío
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const oxColors = () => OX_KEYS.map(k => hexRgb($("c" + k).value));
const COMMON_U = ["efield", "uMode", "uSel", "dispAmt", ...PAL_IDS, ...OX_IDS, ...OX_PAL, "oTones", "oDir", "uRes", "uLo", "uHi", "aspect", "aspect","intensity","coverage","seed","sizeMix","dirMode","dupAmt","mask","ufield","uTexel", ...MIN_IDS];

function initGL() {
  gl = cv.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
  if (!gl) { errEl.textContent = "Tu navegador no soporta WebGL."; return false; }
  try {
    prog = makeProgram(FRAG);
    prog2 = makeProgram(FRAG2);
    prog3 = makeProgram(FRAG3);
    pushProg = makeProgram(PUSH);
  } catch (e) { errEl.textContent = "Error de shader: " + e.message; return false; }
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  U = locs(prog, [...COMMON_U, "tex", "showOrig", "hasGel"]);
  U2 = locs(prog2, [...COMMON_U, "tex", "showOrig", "hasGel"]);
  U3 = locs(prog3, [...COMMON_U, "tex", "showOrig", "hasGel"]);
  PL = locs(pushProg, [...COMMON_U, "pc", "pv", "pr"]);
  tex = gl.createTexture();
  maskTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.activeTexture(gl.TEXTURE0);
  return true;
}

// campo del gel: dos texturas RGBA8 (ping-pong), 0 = sin desplazamiento extra
function zeroGelData() {
  const d = new Uint8Array(uw * uh * 4);
  for (let i = 0; i < uw * uh; i++) { d[i*4] = 128; d[i*4+2] = 128; }
  return d;
}
function makeFieldPair(unit, texArr, fboArr, zero) {
  gl.activeTexture(unit);
  for (let j = 0; j < 2; j++) {
    if (texArr[j]) { gl.deleteTexture(texArr[j]); gl.deleteFramebuffer(fboArr[j]); }
    texArr[j] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texArr[j]);
    for (const [kk, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                           [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
      gl.texParameteri(gl.TEXTURE_2D, kk, v);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, uw, uh, 0, gl.RGBA, gl.UNSIGNED_BYTE, zero);
    fboArr[j] = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboArr[j]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texArr[j], 0);
  }
}
function initGel(w, h) {
  const k = GEL_SIDE / Math.max(w, h);
  uw = Math.max(1, Math.round(w * k)); uh = Math.max(1, Math.round(h * k));
  const zero = zeroGelData();
  makeFieldPair(gl.TEXTURE2, gelTex, gelFbo, zero);     // O: mueve imagen y pliegues
  makeFieldPair(gl.TEXTURE3, eTex, eFbo, zero);         // E: solo pliegues
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0);
  gelCur = 0; eCur = 0; state.hasGel = false;
}
function setCommon(L) {
  gl.uniform1f(L.aspect, imgW / imgH);
  gl.uniform1f(L.intensity, +$("int").value);
  gl.uniform1f(L.coverage, +$("cov").value);
  gl.uniform1f(L.seed, state.seed);
  gl.uniform1f(L.sizeMix, state.size);
  gl.uniform1f(L.dirMode, state.dir);
  gl.uniform1f(L.dupAmt, state.dup);
  gl.uniform1f(L.dispAmt, +$("sDesp").value);
  for (const id of MIN_IDS) gl.uniform1f(L[id], +$(id).value);
  PAL_IDS.forEach((id, i) => gl.uniform3fv(L[id], state.pal[i]));
  for (const id of OX_IDS) gl.uniform1f(L[id], +$(id).value);
  OX_PAL.forEach((id, i) => gl.uniform3fv(L[id], oxColors()[i]));
  gl.uniform1f(L.oTones, state.oTones); gl.uniform1f(L.oDir, state.oDir);
  gl.uniform2f(L.uRes, imgW, imgH);
  gl.uniform1f(L.uLo, state.lum[0]); gl.uniform1f(L.uHi, state.lum[1]);
  gl.uniform1i(L.mask, 1);
  gl.uniform1i(L.ufield, 2);
  gl.uniform1i(L.efield, 3);
  gl.uniform2f(L.uTexel, 1 / uw, 1 / uh);
}
// sel 0 = campo O, 1 = campo E. mode 0 = arrastrar, 1 = empujar hacia fuera del centro (vx = fuerza).
function pushField(sel, mode, cx, cy, vx, vy, r) {
  const texA = sel ? eTex : gelTex, fboA = sel ? eFbo : gelFbo, cur = sel ? eCur : gelCur, dst = 1 - cur;
  gl.useProgram(pushProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA[dst]);
  gl.viewport(0, 0, uw, uh);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, gelTex[gelCur]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, eTex[eCur]);
  setCommon(PL);
  gl.uniform1f(PL.uSel, sel); gl.uniform1f(PL.uMode, mode);
  gl.uniform2f(PL.pc, cx, cy); gl.uniform2f(PL.pv, vx, vy); gl.uniform1f(PL.pr, r);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (sel) eCur = dst; else gelCur = dst;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, imgW, imgH);
  gl.activeTexture(gl.TEXTURE0);
}
// Mover gel en Memoria mineral y Óxido solar: arrastra la imagen (campo O); los pliegues van con ella
function pushStep(cx, cy, vx, vy, r) {
  pushField(0, 0, cx, cy, vx, vy, r);
  pushField(1, 3, cx, cy, vx, vy, r);
}
// Mover gel en Sesgo líquido: empuja solo los pliegues; la foto no se mueve
function pushFolds(cx, cy, vx, vy, r) {
  pushField(1, 0, cx, cy, vx, vy, r);
  const spread = Math.max(2, Math.min(14, r * uh * .25));      // suaviza para que la cresta sea ancha, como un gel espeso
  pushField(1, 2, cx, cy, spread, 0, r * 1.6);
}
function snapField(sel) {
  const b = new Uint8Array(uw * uh * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, (sel ? eFbo : gelFbo)[sel ? eCur : gelCur]);
  gl.readPixels(0, 0, uw, uh, gl.RGBA, gl.UNSIGNED_BYTE, b);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return b;
}
function restoreField(sel, b) {
  gl.activeTexture(sel ? gl.TEXTURE3 : gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, (sel ? eTex : gelTex)[sel ? eCur : gelCur]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, uw, uh, gl.RGBA, gl.UNSIGNED_BYTE, b);
  gl.activeTexture(gl.TEXTURE0);
}

// Paleta de la foto: oscuro y claro medios + 3 colores dominantes (favoreciendo los saturados)
function extractPalette(cnv) {
  const N = 48, c = document.createElement("canvas"); c.width = c.height = N;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(cnv, 0, 0, N, N);
  const d = x.getImageData(0, 0, N, N).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i] / 255, d[i+1] / 255, d[i+2] / 255]);
  const lum = p => .2126 * p[0] + .7152 * p[1] + .0722 * p[2];
  const sorted = px.slice().sort((a, b) => lum(a) - lum(b));
  const avg = arr => arr.reduce((s, p) => [s[0] + p[0], s[1] + p[1], s[2] + p[2]], [0, 0, 0]).map(v => v / arr.length);
  const k = Math.max(1, Math.round(px.length * .08));
  const dark = avg(sorted.slice(0, k)), light = avg(sorted.slice(-k));
  state.lum = [lum(sorted[Math.floor(px.length * .03)]), lum(sorted[Math.floor(px.length * .97)])];
  const bins = new Map();
  for (const p of px) {
    const key = p.map(v => Math.min(3, Math.floor(v * 4))).join();
    const sat = Math.max(...p) - Math.min(...p);
    const b = bins.get(key) || { w: 0, s: [0, 0, 0] };
    b.w += .1 + 3.*sat; b.s = [b.s[0] + p[0], b.s[1] + p[1], b.s[2] + p[2]]; b.n = (b.n || 0) + 1;
    bins.set(key, b);
  }
  const cand = [...bins.values()].sort((a, b) => b.w - a.w).map(b => b.s.map(v => v / b.n));
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const dom = [];
  for (const cc of cand) { if (dom.every(o => dist(o, cc) > .25)) dom.push(cc); if (dom.length === 3) break; }
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  while (dom.length < 3) dom.push(mix(dark, light, dom.length === 1 ? .35 : .7));
  return [dark, light, ...dom];
}

async function decode(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
  }
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img); img.onerror = () => rej(new Error("decode"));
      img.src = url;
    });
  } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}

async function loadImage(file) {
  errEl.textContent = "";
  if (!gl) { errEl.textContent = errEl.textContent || "WebGL no está disponible."; return; }
  try {
    let src;
    try { src = await decode(file); }
    catch (e) {
      const heic = /hei[cf]/i.test(file.type + file.name);
      throw new Error(heic
        ? "Este navegador no puede leer HEIC/HEIF. Abre la app en Safari o exporta la foto a JPG/PNG."
        : "No se pudo leer esa imagen (formato no compatible o archivo dañado).");
    }
    let w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    const lim = Math.min(MAX_SIDE, gl.getParameter(gl.MAX_TEXTURE_SIZE));
    const k = Math.min(1, lim / Math.max(w, h));
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    const tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h;
    tmp.getContext("2d").drawImage(src, 0, 0, w, h);
    if (src.close) src.close();
    imgW = w; imgH = h; cv.width = w; cv.height = h;
    gl.viewport(0, 0, w, h);
    uploadBase(tmp);
    baseStack.length = 0; syncStack();
    resetMask(w, h); initGel(w, h);
    state.loaded = true;
    for (const id of ["clearP", "clearG"]) $(id).disabled = false;
    drop.style.display = "none"; wrap.classList.add("on");
    $("dl").disabled = false; $("apply").disabled = false;
    $("info").textContent = `${w} × ${h} px` + (k < 1 ? " (reducida al límite del navegador)" : "");
    render();
  } catch (e) { errEl.textContent = e.message; }
}

// ---- apilar filtros: 'Aplicar filtro' fija el resultado como nueva imagen base ----
const MAX_STACK = 6;
const baseStack = [];                 // imágenes base anteriores (canvas), la última es la inmediata
let baseCanvas = null;
function uploadBase(src) {
  baseCanvas = src;
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  state.pal = extractPalette(src);
}
function syncStack() {
  $("unapply").disabled = baseStack.length === 0;
  $("stackInfo").textContent = baseStack.length ? baseStack.length + " filtro" + (baseStack.length > 1 ? "s" : "") + " aplicado" + (baseStack.length > 1 ? "s" : "") : "";
}
function copyCanvas(c) {
  const t = document.createElement("canvas"); t.width = c.width; t.height = c.height;
  t.getContext("2d").drawImage(c, 0, 0);
  return t;
}
function resetControls() {          // vuelve los ajustes de los filtros a sus valores iniciales (no toca el pincel)
  const keep = new Set(["rad", "grad", "gstr"]);
  document.querySelectorAll("aside input[type=range]").forEach(el => {
    if (keep.has(el.id) || +el.value === +el.defaultValue) return;
    el.value = el.defaultValue; el.dispatchEvent(new Event("input"));
  });
  for (const k of OX_KEYS) {
    const c = $("c" + k);
    if (c.value !== c.defaultValue) { c.value = c.defaultValue; $("h" + k).value = c.defaultValue; }
  }
  document.querySelectorAll("aside select[data-key]").forEach(el => {
    const d = [...el.options].find(o => o.defaultSelected);
    if (!d || el.value === d.value) return;
    el.value = d.value; el.dispatchEvent(new Event("change"));
  });
}
$("apply").addEventListener("click", () => {
  if (!state.loaded || stroking) return;
  errEl.textContent = "";
  try {
    cancelAnimationFrame(raf); drawNow();                   // resultado actual, con todos los ajustes
    const before = baseCanvas;
    const result = copyCanvas(cv);
    baseStack.push(before); if (baseStack.length > MAX_STACK) baseStack.shift();
    uploadBase(result);
    resetMask(imgW, imgH); initGel(imgW, imgH);             // pinceladas y zona protegida se reinician
    resetControls();
    state.effect = 3;                                       // la imagen base ya lleva el filtro: elige el siguiente
    document.querySelectorAll('.seg[data-key="effect"] button').forEach(x => x.classList.remove("on"));
    syncStack(); render();
  } catch (e) { errEl.textContent = "No se pudo aplicar el filtro: " + e.message; }
});
$("unapply").addEventListener("click", () => {
  if (!baseStack.length) return;
  uploadBase(baseStack.pop());
  state.effect = 3;
  document.querySelectorAll('.seg[data-key="effect"] button').forEach(x => x.classList.remove("on"));
  resetMask(imgW, imgH); initGel(imgW, imgH);
  syncStack(); render();
});

function render() {
  if (!state.loaded) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(drawNow);
}
function drawNow() {
  {
    const L = [U, U2, U3, U][state.effect];            // efecto 3 = ninguno (muestra la imagen base)
    gl.useProgram([prog, prog2, prog3, prog][state.effect]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, imgW, imgH);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, gelTex[gelCur]);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, eTex[eCur]);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(L.tex, 0);
    setCommon(L);
    gl.uniform1f(L.showOrig, state.effect === 3 ? 1 : state.showOrig);
    gl.uniform1f(L.hasGel, state.hasGel ? 1 : 0);
    drawTiled();
  }
}

// Dibuja por franjas de ~1 Mpx con finish() entre cada una: así ninguna llamada a la GPU dura lo
// bastante como para que el navegador la considere colgada y reinicie el contexto (pantalla blanca).
function drawTiled() {
  const rows = Math.max(16, Math.floor(1e6 / imgW));
  gl.enable(gl.SCISSOR_TEST);
  for (let y = 0; y < imgH; y += rows) {
    gl.scissor(0, y, imgW, Math.min(rows, imgH - y));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.finish();
  }
  gl.disable(gl.SCISSOR_TEST);
}

// ---- UI ----
$("vInt").textContent = (+$("int").value).toFixed(2);
$("vCov").textContent = (+$("cov").value).toFixed(2);
$("vsDesp").textContent = (+$("sDesp").value).toFixed(2);
$("vRad").textContent = (+$("rad").value).toFixed(2);
$("vGrad").textContent = (+$("grad").value).toFixed(2);
$("vStr").textContent = (+$("gstr").value).toFixed(2);
for (const id of OX_IDS) {
  const sp = $("v" + id), inp = $(id);
  sp.textContent = (+inp.value).toFixed(2);
  inp.addEventListener("input", () => { sp.textContent = (+inp.value).toFixed(2); render(); });
}
for (const id of MIN_IDS) {
  const sp = $("v" + id), inp = $(id);
  const show = () => { sp.textContent = (id === "mHue" || id === "mVHue") ? Math.round(+inp.value) + "°" : (+inp.value).toFixed(2); };
  show();
  inp.addEventListener("input", () => { show(); render(); });
}
document.querySelector('.seg[data-key="effect"]').addEventListener("click", e => {
  const bt = e.target.closest("button"); if (!bt) return;
  $("fxLiquid").hidden = +bt.dataset.v !== 0;
  $("fxMineral").hidden = +bt.dataset.v !== 1;
  $("fxOxido").hidden = +bt.dataset.v !== 2;
  $("brushPanel").hidden = +bt.dataset.v === 2;
  if (+bt.dataset.v === 2) {                      // desactiva el pincel al entrar a Óxido solar
    state.tool = 0; cv.classList.remove("brush"); ring.style.display = "none";
    document.querySelectorAll('.seg[data-key="tool"] button').forEach(x => x.classList.toggle("on", x.dataset.v === "0"));
  }
});
for (const id of ["int", "cov", "sDesp", "rad", "grad", "gstr"]) {
  $(id).addEventListener("input", () => {
    $({int:"vInt", cov:"vCov", sDesp:"vsDesp", rad:"vRad", grad:"vGrad", gstr:"vStr"}[id]).textContent = (+$(id).value).toFixed(2);
    render();
  });
}
document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    state[seg.dataset.key] = +b.dataset.v;
    render();
  });
});
for (const k of OX_KEYS) {
  const c = $("c" + k), h = $("h" + k);
  c.addEventListener("input", () => { h.value = c.value; render(); });
  h.addEventListener("input", () => {
    let v = h.value.trim(); if (v && v[0] !== "#") v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { c.value = v.toLowerCase(); render(); }
  });
  h.addEventListener("blur", () => { h.value = c.value; });
}
document.querySelectorAll("select[data-key]").forEach(sel =>
  sel.addEventListener("change", () => { state[sel.dataset.key] = +sel.value; render(); }));
// historial de patrones: cada "Nuevo patrón" se guarda y se puede volver atrás o adelante
const seedHist = [state.seed];
let seedIdx = 0;
function syncSeedBtns() {
  $("seedPrev").disabled = seedIdx === 0;
  $("seedNext").disabled = seedIdx >= seedHist.length - 1;
  $("seedPrev").title = seedIdx ? "Volver al patrón anterior (" + seedIdx + " guardados)" : "No hay patrón anterior";
}
function goSeed(i) { seedIdx = i; state.seed = seedHist[i]; syncSeedBtns(); render(); }
$("seed").addEventListener("click", () => {
  seedHist.length = seedIdx + 1;                   // un patrón nuevo descarta los "siguientes"
  seedHist.push(Math.round(Math.random() * 900) / 10 + 1);
  goSeed(seedHist.length - 1);
});
$("seedPrev").addEventListener("click", () => { if (seedIdx > 0) goSeed(seedIdx - 1); });
$("seedNext").addEventListener("click", () => { if (seedIdx < seedHist.length - 1) goSeed(seedIdx + 1); });

const cmp = $("cmp");
const setOrig = v => { state.showOrig = v; render(); };
cmp.addEventListener("pointerdown", () => setOrig(1));
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) cmp.addEventListener(ev, () => setOrig(0));

// ---- pinceles (zona protegida y dedo sobre el gel) + deshacer unificado ----
const mk = $("mk"), mctx = mk.getContext("2d", { willReadFrequently: true }), ring = $("ring");
const history = [];                 // { kind: "mask" | "gel", snap }
let stroking = false, last = null, lastPtr = null;
const protectR = () => +$("rad").value / 2;     // los deslizadores son diámetros (fracción del alto)
const gelR = () => +$("grad").value / 2;
const toolR = () => state.tool === 2 ? gelR() : protectR();

function resetMask(w, h) {
  const k = Math.min(1, MASK_SIDE / Math.max(w, h));
  mk.width = Math.max(1, Math.round(w * k)); mk.height = Math.max(1, Math.round(h * k));
  mctx.clearRect(0, 0, mk.width, mk.height);
  history.length = 0;
  uploadMask(); syncUndo();
}
function uploadMask() {
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mk);
  gl.activeTexture(gl.TEXTURE0);
}
function syncUndo() { $("undo").disabled = history.length === 0; }
function pushHistory(kind) {
  history.push({ kind, snap: kind === "mask"
    ? { img: mctx.getImageData(0, 0, mk.width, mk.height), e: snapField(1) }
    : { o: snapField(0), e: snapField(1) } });
  if (history.length > MAX_UNDO) history.shift();
  syncUndo();
}
function undo() {
  if (!history.length || stroking) return;
  const h = history.pop();
  if (h.kind === "mask") { mctx.putImageData(h.snap.img, 0, 0); uploadMask(); }
  else restoreField(0, h.snap.o);
  restoreField(1, h.snap.e);
  syncUndo(); render();
}
function stamp(x, y) {
  const r = protectR() * mk.height;
  const g = mctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(255,50,50,1)"); g.addColorStop(.3, "rgba(255,50,50,1)"); g.addColorStop(1, "rgba(255,50,50,0)");
  mctx.fillStyle = g;
  mctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function uvPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
function paintTo(p) {                // p en uv; la máscara tiene su propia resolución
  const step = Math.max(1, protectR() * mk.height * .25);
  const a = { x: last.x * mk.width, y: last.y * mk.height }, b = { x: p.x * mk.width, y: p.y * mk.height };
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / step));
  const sB = Math.min(.7, .3 * +$("gstr").value);         // fuerza del empuje (comparte el deslizador Fuerza)
  for (let i = 1; i <= n; i++) {
    const x = a.x + (b.x - a.x) * i / n, y = a.y + (b.y - a.y) * i / n;
    stamp(x, y);
    // el empuje alcanza más allá del círculo (2.3x) para que los pliegues salgan de la zona y se acumulen fuera
    for (let k = 0; k < 3; k++) pushField(1, 1, x / mk.width, y / mk.height, sB, 0, protectR() * 2.3);
    // suavizado: ensancha la cresta de pliegues del borde para que se sienta un gel espeso
    const spread = Math.max(2, Math.min(14, protectR() * uh * .3));
    for (let k = 0; k < 2; k++) pushField(1, 2, x / mk.width, y / mk.height, spread, 0, protectR() * 2.8);
  }
  state.hasGel = true;
  last = p;
  uploadMask(); render();
}
function dragGel(p) {                // empuja el gel a lo largo del trazo, en pasos pequeños
  const dx = p.x - last.x, dy = p.y - last.y, r = gelR(), str = +$("gstr").value;
  const n = Math.min(40, Math.max(1, Math.ceil(Math.hypot(dx * imgW / imgH, dy) / (r * .2))));
  for (let i = 1; i <= n; i++)
    (state.effect === 0 ? pushFolds : pushStep)(last.x + dx * (i - .5) / n, last.y + dy * (i - .5) / n, dx / n * str, dy / n * str, r);
  state.hasGel = true;
  last = p;
  render();
}
function placeRing(e) {
  const r = cv.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const d = 2 * toolR() * r.height;
  ring.style.width = ring.style.height = d + "px";
  ring.style.transform = `translate(${e.clientX - w.left - d / 2}px, ${e.clientY - w.top - d / 2}px)`;
}
function refreshRing() { if (state.tool && lastPtr) placeRing(lastPtr); }
$("rad").addEventListener("input", refreshRing);
$("grad").addEventListener("input", refreshRing);

document.querySelector('.seg[data-key="tool"]').addEventListener("click", () => {
  cv.classList.toggle("brush", state.tool > 0);
  if (!state.tool) ring.style.display = "none"; else refreshRing();
});
cv.addEventListener("pointerdown", e => {
  if (!state.tool || !state.loaded || e.button > 0) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  last = uvPos(e); stroking = true;
  if (state.tool === 1) { pushHistory("mask"); paintTo(last); }
  else pushHistory("gel");
});
cv.addEventListener("pointermove", e => {
  lastPtr = e;
  if (!state.tool) return;
  ring.style.display = "block"; placeRing(e);
  if (!stroking) return;
  if (state.tool === 1) paintTo(uvPos(e)); else dragGel(uvPos(e));
});
const endStroke = () => { stroking = false; };
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("pointerleave", () => { if (!stroking) ring.style.display = "none"; });
$("undo").addEventListener("click", undo);
$("clearP").addEventListener("click", () => {
  if (!state.loaded) return;
  pushHistory("mask");
  mctx.clearRect(0, 0, mk.width, mk.height); uploadMask();
  restoreField(1, zeroGelData());                  // también devuelve los pliegues que el pincel había empujado
  render();
});
$("clearG").addEventListener("click", () => {
  if (!state.loaded) return;
  pushHistory("gel"); restoreField(0, zeroGelData()); restoreField(1, zeroGelData()); render();
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
});

$("dl").addEventListener("click", () => {
  errEl.textContent = "";
  if (gl.isContextLost()) { errEl.textContent = "La GPU se reinició. Recarga la página y vuelve a cargar la imagen."; return; }
  const save = url => {
    const a = document.createElement("a");
    a.href = url; a.download = ["sesgo-liquido", "memoria-mineral", "oxido-solar", "imagen"][state.effect] + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  };
  try {
    cv.toBlob(b => {
      if (b) save(URL.createObjectURL(b));
      else errEl.textContent = "No se pudo generar el PNG (imagen demasiado grande para este navegador).";
    }, "image/png");
  } catch (e) { errEl.textContent = "No se pudo descargar: " + e.message; }
});

const fileIn = $("file");
const pick = () => fileIn.click();
$("open").addEventListener("click", pick);
drop.addEventListener("click", pick);
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") pick(); });
fileIn.addEventListener("change", () => { const f = fileIn.files[0]; if (f) loadImage(f); });
for (const t of [document.body]) {
  t.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  t.addEventListener("dragleave", () => drop.classList.remove("over"));
  t.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer.files[0];
    if (f) loadImage(f);
  });
}

cv.addEventListener("webglcontextlost", e => {
  e.preventDefault();
  errEl.textContent = "La GPU del navegador se reinició (imagen muy pesada para este equipo). Recarga la página y prueba con una imagen más pequeña.";
});
initGL();
</script>
