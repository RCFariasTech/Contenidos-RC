<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contenido RC Farias</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header class="encabezado">
    <img src="/logo_rc_blanco.png" alt="RC Farias" class="logo">
    <span class="encabezado__titulo">Contenido Instagram</span>
    <button id="btn-salir" class="btn btn--fantasma" hidden>Salir</button>
  </header>

  <main class="contenedor">
    <section id="vista-login" class="tarjeta login" hidden>
      <h1>Ingresar</h1>
      <form id="form-login">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn--primario btn--bloque">Ingresar</button>
        <p id="login-error" class="mensaje mensaje--error" role="alert"></p>
      </form>
    </section>

    <section id="vista-app" hidden>
      <nav class="pestanas" aria-label="Secciones">
        <button class="pestana pestana--activa" aria-current="page" type="button">Propuestas del próximo mes</button>
        <button class="pestana" type="button" disabled title="Disponible en la siguiente fase">Repositorio</button>
      </nav>

      <div class="barra-mes">
        <div>
          <h1 id="titulo-mes">Propuestas</h1>
          <p id="resumen-mes" class="barra-mes__resumen"></p>
        </div>
        <div class="barra-mes__acciones">
          <button id="btn-generar" class="btn btn--primario" type="button" hidden>Generar propuestas</button>
          <button id="btn-ajustes" class="btn btn--primario" type="button" disabled>Aplicar ajustes</button>
          <button id="btn-pptx" class="btn btn--secundario" type="button" disabled
                  title="La exportación a PowerPoint llega en la siguiente fase">Descargar PowerPoint</button>
        </div>
      </div>
      <p id="aviso-global" class="aviso" role="status" hidden></p>

      <div id="lista-piezas" class="lista-piezas"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
