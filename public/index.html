<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contenido RC Farias</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header class="encabezado">
    <img src="/logo_rc_blanco.png" alt="RC Farias" class="logo">
    <span class="encabezado__titulo">Contenido Instagram</span>
    <button id="btn-salir" class="btn btn--fantasma" hidden>Salir</button>
  </header>

  <main class="contenedor">
    <section id="vista-login" class="tarjeta login" hidden>
      <h1>Ingresar</h1>
      <form id="form-login">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn--primario btn--bloque">Ingresar</button>
        <p id="login-error" class="mensaje mensaje--error" role="alert"></p>
      </form>
    </section>

    <section id="vista-app" hidden>
      <nav class="pestanas" aria-label="Secciones">
        <button id="tab-propuestas" class="pestana pestana--activa" aria-current="page" type="button">Propuestas del próximo mes</button>
        <button id="tab-repositorio" class="pestana" type="button">Repositorio</button>
      </nav>
      <p id="aviso-global" class="aviso" role="status" hidden></p>

      <div id="seccion-propuestas">

      <div class="barra-mes">
        <div>
          <h1 id="titulo-mes">Propuestas</h1>
          <p id="resumen-mes" class="barra-mes__resumen"></p>
        </div>
        <div class="barra-mes__acciones">
          <button id="btn-generar" class="btn btn--primario" type="button" hidden>Generar propuestas</button>
          <button id="btn-ajustes" class="btn btn--primario" type="button" disabled>Aplicar ajustes</button>
          <button id="btn-pptx" class="btn btn--secundario" type="button" disabled
                  title="Se habilita cuando las 4 piezas están aprobadas">Descargar PowerPoint</button>
        </div>
      </div>

      <div id="lista-piezas" class="lista-piezas"></div>
      </div>

      <div id="seccion-repositorio" hidden>
        <div class="barra-mes">
          <div>
            <h1>Repositorio</h1>
            <p id="resumen-repo" class="barra-mes__resumen"></p>
          </div>
        </div>
        <form id="filtros-repo" class="filtros" role="search" aria-label="Filtrar el repositorio">
          <label>Mes
            <select id="filtro-mes"><option value="">Todos</option></select>
          </label>
          <label>Formato
            <select id="filtro-formato"><option value="">Todos</option><option>Carrusel</option><option>Reel</option></select>
          </label>
          <label>Pilar
            <select id="filtro-pilar"><option value="">Todos</option></select>
          </label>
          <label class="filtros__buscar">Buscar
            <input id="filtro-texto" type="search" placeholder="Tema o tendencia">
          </label>
        </form>
        <div class="tabla-contenedor">
          <table class="tabla-repo">
            <thead>
              <tr>
                <th scope="col">Mes</th><th scope="col">Publicación</th><th scope="col">Formato</th>
                <th scope="col">Tema</th><th scope="col">Tipo · Pilar</th>
                <th scope="col">Creada</th><th scope="col">Aprobada</th><th scope="col">Entregada</th>
              </tr>
            </thead>
            <tbody id="cuerpo-repo"></tbody>
          </table>
        </div>
        <div id="detalle-repo" class="detalle-repo" hidden></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
